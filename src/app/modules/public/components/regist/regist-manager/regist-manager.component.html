<div class="container">
  
  <div class="row">
    <div class="col s12">
      <app-generic-regist-form
        [value]="{'email':params.email}"
        (changes)="onManagerFormChanges($event)">
      </app-generic-regist-form>
    </div>
  </div>

  <div class="row">
    <div class="col s12">
      <button
        mat-raised-button
        color="primary"
        [disabled]="!managerFormValid"
        (click)="onSubmit()">
          Registrar
      </button>
    </div>
  </div>

</div>
