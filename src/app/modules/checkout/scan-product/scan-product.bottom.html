<ng-container *ngIf="byScanner; else search">
  <mx-scanner #scanner
  (scanned)="onScanned($event)"
  [enabled]="true"
  [showToggleButtons]="false"
  ></mx-scanner>
  <div class="row">
    <div class="col s12 center">
      <button mat-raised-button color="accent" (click)="toggleScanner()" >
        <mat-icon>keyboard</mat-icon>
      </button>
    </div>
  </div>
</ng-container>

<ng-template #search >
  <form action="#" class="row" id="search-form">
    <mat-form-field appearance="outline" class="col s12">
      <mat-label>Buscar producto</mat-label>
      <input
      matInput
      type="text"
      name="producto"
      [formControl]="productoCtrl"
      #productInput
      >
      <mat-error *ngIf="productoCtrl.hasError('required')">
      Este dato es necesario
      </mat-error>
    </mat-form-field>
    <div class="row">
      <div class="col s12 center">
        <button mat-raised-button color="primary">Buscar</button>
      </div>
    </div>
  </form>
  <div class="row">
    <div class="col s12 center">
      <button
      mat-raised-button
      color="accent"
      (click)="toggleScanner()" >
        <i class="fas fa-qrcode"></i>
      </button>
    </div>
  </div>
</ng-template>
