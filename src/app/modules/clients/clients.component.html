<div class="container">
  <div class="row">
    <div class="col s12">
      <mx-crud-panel
      listName="Clientes"
      [selectTemplate]="select"
      [addTemplate]="add"
      [list]="clients"
      [height_vh]="100"
      itemSelector="name"
      #crudPanel
      (onDelete)="onDeleteItem($event)"
       >
        <ng-template #add>
          <app-set-client (saved)="crudPanel.closeAll()" ></app-set-client>
        </ng-template>

        <ng-template #select let-client="item" >
          <app-set-client (saved)="crudPanel.closeAll()" [client]="client"></app-set-client>
        </ng-template>
      </mx-crud-panel>
    </div>
  </div>
</div>
