<div class="container">
  <div class="row">
    <div class="col s12 m8">
      <form [formGroup]="formAddProduct">
        <mat-form-field appearance="outline" class="col s12">
          <!-- producto -->
          <mat-label>producto</mat-label>
          <input matInput type="text" name="provider" formControlName="product">
          <mat-error *ngIf="formAddProduct.hasError('required', 'CRF')">
            Este dato es necesario
          </mat-error>
        </mat-form-field>
        <!-- cantidad -->
          <mat-label>Cantidad</mat-label>
          <input matInput type="text" name="cantidad" formControlName="cant">
          <mat-error *ngIf="formAddProduct.hasError('required', 'CRF')">
            Este dato es necesario
          </mat-error>
        <!-- precio -->
        <mat-label>Precio</mat-label>
        <input matInput type="text" name="amount" formControlName="amount">
        <mat-error *ngIf="formAddProduct.hasError('required', 'CRF')">
          Este dato es necesario
        </mat-error>
      </form>
    </div>
  </div>
</div>
