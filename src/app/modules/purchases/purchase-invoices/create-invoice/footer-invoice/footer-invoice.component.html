<form [formGroup]="formFooter">
  <div class="row">
    <div class="col s12 l8 offset-l8">
      <div class="col s4">
        <mat-form-field appearance="outline" >
          <mat-label>subtotal</mat-label>
          <input matInput type="text" name="subtotal" formControlName="subtotal">
        </mat-form-field>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col s12 l8 offset-l8">
      <div class="col s4">
        <mat-form-field appearance="outline" >
          <mat-label>descuento</mat-label>
          <input matInput type="text" name="discount" formControlName="discount">
        </mat-form-field>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col s12 l8 offset-l8">
      <div class="col s4">
        <mat-form-field appearance="outline" >
          <mat-label>Fletes</mat-label>
          <input matInput type="text" name="shipping" formControlName="shipping">
        </mat-form-field>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col s12 l8 offset-l8">
      <div class="col s4">
        <mat-form-field appearance="outline" >
          <mat-label>total</mat-label>
          <input matInput type="text" name="total" formControlName="total">
        </mat-form-field>
      </div>
    </div>
  </div>
</form>
