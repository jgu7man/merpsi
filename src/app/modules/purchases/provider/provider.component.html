<div class="container">
  <div class="row">
    <div class="col s12">
      <mx-crud-panel
      listName="Proveedores"
      [selectTemplate]="select"
      [addTemplate]="add"
      [list]="providers"
      [height_vh]="100"
      itemSelector="name"
      #crudPanel
      (onDelete)="onDeleteItem($event)"
       >

        <ng-template #add>
          <app-set-provider (submited)="crudPanel.closeAll()" ></app-set-provider>
        </ng-template>

        <ng-template #select let-providers="item" >
           <app-set-provider (submited)="crudPanel.closeAll()" [provider]="providers"></app-set-provider> 
        </ng-template>
      </mx-crud-panel>
    </div>
  </div>
</div>
