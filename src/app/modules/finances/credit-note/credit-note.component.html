<div class="container">
  <div class="row">
    <div class="col s12">
      <mx-crud-panel
      listName="Nota de Credito"
      [selectTemplate]="select"
      [addTemplate]="add"
      [height_vh]="100"
      itemSelector="name"
      #crudPanel
       >
        <ng-template #add>
          <app-form-credit-note
          (submited)="crudPanel.closeAll()"
          ></app-form-credit-note>
        </ng-template>

        <ng-template #select let-client="item" >
        </ng-template>
      </mx-crud-panel>
    </div>
  </div>
</div>
