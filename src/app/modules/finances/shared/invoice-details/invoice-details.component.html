<div class="row">
  <form [formGroup]="formAddProduct">
    <ng-container *ngIf="concept">
      <!-- UPC -->
      <div class="col s2">
        {{concept.product.UPC}}
      </div>
      <!-- DESCRIPTION -->
      <div class="col s3">
        {{concept.product.description}}
      </div>
        <!-- Cantidad -->
        <div class="col s2">
          <ng-container *ngIf="allowEditCant; else editCant">
            {{concept.cant}}
          </ng-container>
          <ng-template #editCant>
            <mat-form-field appearance="outline" class="col s12">
              <!-- <mat-label>Cantidad</mat-label> -->
              <input matInput type="number" name="cantidad" formControlName="cant">
              <mat-error *ngIf="formAddProduct.hasError('required', 'cant')">
                Este dato es necesario
              </mat-error>
              <mat-error *ngIf="formAddProduct.hasError('max', 'cant')">
                cantidad no disponible, ingrese un numero menor
              </mat-error>
            </mat-form-field>
          </ng-template>

        </div>

        <!-- Precio -->
        <div class="col s2">
          <ng-container *ngIf="!allowEditPrice; else editPrice">
            {{concept.unit_price}}
          </ng-container>
          <ng-template #editPrice>
            <mat-form-field appearance="outline" class="col s12">
              <mat-label>Precio Unitario</mat-label>
              <input matInput type="number" name="unit_price" formControlName="unit_price">
              <mat-error *ngIf="formAddProduct.hasError('required', 'unit_price')">
                Este dato es necesario
              </mat-error>
              <mat-error *ngIf="formAddProduct.hasError('min', 'unit_price')">
                ingrese un monto mayor a {{concept.unit_price}}
              </mat-error>
            </mat-form-field>
          </ng-template>

        </div>
        <!-- total -->
        <div class="col s2">
          {{itemAmount | currency}}

        </div>
        <div class="col s1">
          <button
            mat-icon-button
            color="warn"
            [disabled]="isRelatedDocument"
            (click)="deleteConcept(concept)">
            <mat-icon>close</mat-icon>
          </button>
        </div>
    </ng-container>
  </form>
</div>
