<ng-container *ngIf="foot.footer$.value as footer">
  <form [formGroup]="formFooter">
    <div class="row">
      <div class="col s12 l8 offset-l8">
        <div class="col s4">
          Subtotal: {{footer.subtotal | number}}
        </div>
      </div>
    </div>
    <ng-container>
      <div class="row">
        <div class="col s12 l8 offset-l8">
          <div class="col s4">
            descuento: {{footer.discount | number}}
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col s12 l8 offset-l8">
          <div class="col s4">
            Fletes: {{footer.shipping | number}}
          </div>
        </div>
      </div>
    </ng-container>

    <div class="row">
      <div class="col s12 l8 offset-l8">
        <div class="col s4">
          <ng-container *ngFor="let tax of footer.taxes">
            {{tax.name}}({{tax.rate}}%) ${{tax.amount}}
          </ng-container>
        </div>

    </div>
    <div class="row">
