<div class="container">
  <div class="row">
    <div class="col s12 ">
      <form [formGroup]="formAddProduct">
        <ng-container *ngIf="concept">
          <!-- UPC -->
          <div class="col s2">
            {{concept.product.UPC}}
          </div>
          <!-- DESCRIPTION -->
          <div class="col s2">
            {{concept.product.description}}
          </div>
          <ng-container *ngIf="!invoice else seeUnit_Price">
            <!-- cantidad -->
            <div class="col s2">
              <mat-form-field appearance="outline" class="col s12">
                <mat-label>Cantidad</mat-label>
                <input matInput type="number" name="cantidad" formControlName="cant">
                <mat-error *ngIf="formAddProduct.hasError('required', 'cant')">
                  Este dato es necesario
                </mat-error>
                <mat-error *ngIf="formAddProduct.hasError('max', 'cant')">
                  cantidad no disponible, ingrese un numero menor
                </mat-error>
              </mat-form-field>
            </div>
            <!-- precio -->
            <div class="col s2">
              <mat-form-field appearance="outline" class="col s12">
                <mat-label>Precio Unitario</mat-label>
                <input matInput type="number" name="unit_price" formControlName="unit_price">
                <mat-error *ngIf="formAddProduct.hasError('required', 'unit_price')">
                  Este dato es necesario
                </mat-error>
              </mat-form-field>
            </div>
            <!-- total -->
            <div class="col s2">
              <ng-container *ngIf="document!= 'credit'">
                <ng-container *ngFor="let item of conceptInvoice.details$.value">
                  <ng-container *ngIf="item.product.UPC == concept.product.UPC">
                    {{item.amount || 0 | currency}}
                  </ng-container>
                </ng-container>
              </ng-container>
              <ng-container *ngIf="document== 'credit'">
                <ng-container *ngFor="let item of conceptInvoice.details_Credit$.value">
                  <ng-container *ngIf="item.product.UPC == concept.product.UPC">
                    {{item.amount || 0 | currency}}
                  </ng-container>
                </ng-container>
              </ng-container>
            </div>
            <div class="col s2">
              <button mat-raised-button color="warn" [disabled]="document == 'credit' || document == 'debit'" (click)="deleteConcept(concept)">
                X
              </button>
            </div>
          </ng-container>
          <ng-template #seeUnit_Price>
            <div class="col s2">
              {{concept.cant}}
            </div>
            <div class="col s2">
              {{concept.unit_price}}
            </div>
            <div class="col s2">
              {{concept.amount}}
            </div>
          </ng-template>
        </ng-container>
        <ng-container *ngIf="concept && document== 'credit'">

        </ng-container>
      </form>
    </div>
  </div>
</div>
