<ng-container *ngIf="foot.currentfoot$.value as footer">
  <form [formGroup]="formFooter">
    <div class="row">
      <div class="col s12 l8 offset-l8">
        <div class="col s4">
          Subtotal: {{footer.subtotal}}
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col s12 l8 offset-l8">
        <div class="col s4">
          <mat-form-field appearance="outline" >
            <mat-label>descuento</mat-label>
            <input matInput type="number" name="discount" formControlName="discount">
          </mat-form-field>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col s12 l8 offset-l8">
        <div class="col s4">
          <mat-form-field appearance="outline" >
            <mat-label>Fletes</mat-label>
            <input matInput type="number" name="shipping" formControlName="shipping">
          </mat-form-field>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col s12 l8 offset-l8">
        <div class="col s4">
          <app-tax-amount-crud
          [amount_base]="footer.subtotal"
          (totalTax)="getTotalTaxes()">
          </app-tax-amount-crud>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col s12 l8 offset-l8">
        <div class="col s4">
         Total: {{footer.total}}
        </div>
      </div>
    </div>
  </form>
</ng-container>
