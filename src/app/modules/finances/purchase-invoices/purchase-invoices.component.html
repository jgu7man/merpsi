<div class="container">
  <div class="row">
    <div class="col s12">
      <mx-sort-options [fields]="['invoiceId']"></mx-sort-options>
      <mx-crud-panel
      listName="Facturas de Compras"
      [addTemplate]="add"
      [list]="listPuchases"
      [selectTemplate]="select"
      [height_vh]="100"
      [itemSelector]="['invoiceId']"
      #crudPanel
      (onAdd)="onCreate()"
      (onClose)="onClose()"
      >

      <ng-template #add >
        <app-create-invoice
        (submited)="crudPanel.closeAll()"
        ></app-create-invoice>
      </ng-template>

      <ng-template #select let-invoice="item" >
        <app-select-puchase  [invoice]="invoice"></app-select-puchase>
      </ng-template>
      </mx-crud-panel>
      <mx-index-caller 
      prevBtn="Anterior"
      nextBtn="Siguiente"
      colorBtn="primary"
      [centerMessage]="centerMessage"
      [merge]="false"
      ></mx-index-caller>
    </div>
  </div>
</div>
