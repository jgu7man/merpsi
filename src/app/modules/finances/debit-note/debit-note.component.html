<div class="container">
  <div class="row">
    <div class="col s12">
      <mx-sort-options [fields]="['invoiceId']"></mx-sort-options>
      <mx-crud-panel
      listName="Nota de Debito"
      [selectTemplate]="select"
      [list]="listDebits"
      [addTemplate]="add"
      [height_vh]="100"
      [itemSelector]="['id']"
      #crudPanel
       >
        <ng-template #add>
          <app-create-debit-note
          (submited)="crudPanel.closeAll()"
          ></app-create-debit-note>
        </ng-template>

        <ng-template #select let-document="item" >
          <app-select-debit-note [document]="document"></app-select-debit-note>
        </ng-template>
      </mx-crud-panel>

      <mx-index-caller
      prevBtn="Anterior"
      nextBtn="Siguiente"
      colorBtn="primary"
      [centerMessage]="centerMessage"
      [merge]="false"
      ></mx-index-caller>

    </div>
  </div>
</div>
