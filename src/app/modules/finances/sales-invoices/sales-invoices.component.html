<div class="container">
  <div class="row">
    <div class="col s12">.
      <!-- <ng-container *ngIf="sales.listInvoice() | async as list"> -->
        <mx-sort-options [fields]="['invoiceId','status']" ></mx-sort-options>
        <mx-crud-panel
        listName="Facturas de Ventas"
        [addTemplate]="add"
        [list]="listInvoice"
        [selectTemplate]="select"
        [height_vh]="82"
        [itemSelector]="['invoiceId','status','action_date_formated']"
        #crudPanel
        [addConfig]="{'label': 'Crear Factura'}"
        (onAdd)="onCreate()"
        (onClose)="onClose()"
        >
          <ng-template #add >
            <app-create-invoice-sales
            (submited)="crudPanel.closeAll()"
            ></app-create-invoice-sales>
          </ng-template>

          <ng-template #select let-invoice="item" >
            <app-create-invoice-sales  [invoice]="invoice"></app-create-invoice-sales>
          </ng-template>

        </mx-crud-panel>
        <!-- </ng-container> -->
        <mx-index-caller
        prevBtn="Anterior"
        nextBtn="Siguiente"
        colorBtn="primary"
        [centerMessage]="centerMessage"
        [merge]="false"
        ></mx-index-caller>
      </div>
  </div>
</div>
