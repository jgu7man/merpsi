<div class="container">
  <div class="row">
    <div class="col s12">.
      <!-- <ng-container *ngIf="sales.listInvoice() | async as list"> -->
        <mx-crud-panel
        listName="Facturas de Ventas"
        [addTemplate]="add"
        [list]="listInvoice"
        [selectTemplate]="select"
        [height_vh]="100"
        [itemSelector]="['invoiceId','status','action_date_formated']"
        #crudPanel
        (onAdd)="onCreate()"
        (onClose)="onClose()"
        >
        <ng-template #add >
          <app-create-invoice-sales 
          (submited)="crudPanel.closeAll()"
          ></app-create-invoice-sales>
        </ng-template>
  
          <ng-template #select let-invoice="item" >
            <app-create-invoice-sales  [invoice]="invoice"></app-create-invoice-sales>
          </ng-template>
        </mx-crud-panel>
      <!-- </ng-container> -->
    </div>
  </div>
</div>
