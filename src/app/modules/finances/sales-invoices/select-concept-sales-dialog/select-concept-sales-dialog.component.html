<div class="col s3">
  sales
  <mx-searcher-list 
  [label]="'Concepto'" 
  [collection]="'businesses/' + businessRef + '/products/'"
  [param]="'UPC'" 
  [hideList]="true"
  (results)="getValue($event)" 
  (listLoaded)="getList($event)"
  >
  </mx-searcher-list>
  <ng-container *ngIf="productStoresStoks as products">
    <ng-container *ngIf="products.length > 0; else emptyStock">
    <ng-container *ngFor="let product of products">
    <div class="row">
        <div class="col s3"><b>{{product.UPC}}</b><br></div>
        <div class="col s3"> Sede:{{ product.store_id | store | async}} <br></div>
          <div class="col s3"> Existencias:{{product.stock}}</div>
          <div class="col s3"> <button mat-button color="accent" (click)="getValue(product)" > Agregar</button></div>
      </div>
    </ng-container>
    </ng-container>
    <ng-template #emptyStock>
      <b>No existes exitencias para el concepto seleccionado</b>
    </ng-template>
    
  </ng-container>
</div>
