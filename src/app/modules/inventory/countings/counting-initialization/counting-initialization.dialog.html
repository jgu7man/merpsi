<p mat-dialog-title>Iniciar un arqueo</p>

<mat-dialog-content>
  <app-store-selector
  (changes)="selected = $event"
  ></app-store-selector>
</mat-dialog-content>

<mat-dialog-actions
style="display: flex; justify-content: space-around;">
    <button mat-raised-button
    (click)="dialog.close()"
    >Cancelar</button>
    <button mat-raised-button
    (click)="dialog.close(selected)"
    color="primary"
    [disabled]="!selected"
    >Iniciar</button>
</mat-dialog-actions>
