<div class="row product-container">
  <div class="col s12 m7">
    <mat-card>
      <mat-card-content>
        <app-product-form></app-product-form>
      </mat-card-content>
    </mat-card>
  </div>

  <div class="col s12 m5">
    <!-- ALMACENES -->
    <app-product-storage></app-product-storage>
  </div>
</div>

<div class="row">
  <div class="col s12 center">
    <button
      mat-raised-button
      color="primary"
      (click)="current.save()"
      [disabled]="!(current.formValid$ | async)"
    >Guardar</button>
  </div>
</div>
