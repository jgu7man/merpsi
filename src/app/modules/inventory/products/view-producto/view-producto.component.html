<div class="container" *ngIf="product">
  <div class="row">
    <div class="col s12 l2">
      <button mat-icon-button (click)="close.emit(product)">
        <i class="fas fa-times fa-lg"></i>
      </button>
    </div>
    <div class="col s12 l10">
      <div class="row">
        <div class="col s12 l8">
          <mat-card>
            <mat-card-header>
              <mat-card-title>{{product.reference}}</mat-card-title>
              <mat-card-subtitle>{{product.UPC}}</mat-card-subtitle>
            </mat-card-header>
            <mat-card-content>

              <app-product-form
                [product]="product"
                (patch)="productUpdated($event)"
              ></app-product-form>

            </mat-card-content>
            <!-- NOTE ONLY ACTIVATE FOR DEV CASES -->
            <!-- <mat-card-actions>
              <button mat-button color="warn" (click)="onDelete()">Eliminar</button>
            </mat-card-actions> -->
          </mat-card>
        </div>
      </div>
    </div>
  </div>
</div>
