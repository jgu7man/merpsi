<mat-drawer-container id="productos-container" [hasBackdrop]="true">
  <!-- PRODUCT PANEL -->
  <mat-drawer #productDrawer="matDrawer"
  id="producto-panel"
  [disableClose]="true"
  [position]="'start'"
  [mode]="'side'"
  [opened]="true">
  
    <div class="row">
      
      <div class="col s12 l1">
        <button mat-icon-button (click)="productDrawer.close()">
          <mat-icon>close</mat-icon>
        </button>
      </div>

      <div class="col s12 l10">
        <app-product-single></app-product-single>
      </div>

      <div class="col s12 l1"></div>

    </div>

  </mat-drawer>
  
  <!-- CATEGORIA PANEL -->
  <mat-drawer #categoriasDrawer="matDrawer"
  [position]="'end'"
  [mode]="'side'"
  [opened]="false">

  </mat-drawer>


  <!-- DRAWER CONTENT -->
  <mat-drawer-content>

    <mat-tab-group>
      <mat-tab label="Productos">
        <div class="container list-container">

          <!-- SEARCHER -->
          <!-- Zona para realizar búsquedas por código en un input o scanner -->
          <div class="row">

            <!-- Bucar por código -->
            <div class="col s6 m4 l3">
              <mat-form-field appearance="outline">
                <mat-label>Bucar por código</mat-label>
                <input
                matInput
                type="text"
                name="name"
                [formControl]="codeScannedCtrl"
                (keyup.Enter)="searchCode()"
                >
                <!-- <mat-error *ngIf="formName.hasError('required', 'name')">
                  Bucar por código es necesario
                </mat-error> -->
              </mat-form-field>
            </div>

            <!-- Buscar por scanner -->
            <div class="col s6 m4 l3">
              <mx-scanner-button 
              [label]="'Escanear mediante código'"
              (result)="onScanned($event)"
              ></mx-scanner-button>
            </div>
            
            <!-- Restablecer -->
            <div class="col s6 m4 l3">
              <button mat-button color="warn"
              (click)="restoreCriteria()"
              >Restablecer criterios de búsqueda</button>
            </div>
          </div>


          <!-- Tabla de resultados -->
          <div class="row">
            <!-- Controla la búsqueda -->
            <div class="col s12">
              <mx-sort-options [filterOption]="false" [fields]="['UPC', 'reference']" ></mx-sort-options>
            </div>

            <div class="col s12">
              <div id="product-list" class="mat-elevation-z3">

                <!-- RESULT TEMPLATE -->
                <ng-container *ngIf="products.length > 0; else emptyProducts">
                  <table  mat-table #table [dataSource]="products">

                    <!-- UPC COL -->
                    <ng-container matColumnDef="UPC" sticky>
                      <th mat-header-cell *matHeaderCellDef> UPC (Código de Producto Universal) </th>
                      <td mat-cell *matCellDef="let product"> {{product.UPC}} </td>
                    </ng-container>

                    <!-- REFERENCE COL -->
                    <ng-container matColumnDef="reference">
                      <th mat-header-cell *matHeaderCellDef> Referencia </th>
                      <td mat-cell *matCellDef="let product"> {{product.reference}} </td>
                    </ng-container>

                    <!-- TOTAL STOCK COL (BETA) -->
                    <!-- <ng-container matColumnDef="existencias_totales">
                      <th mat-header-cell *matHeaderCellDef> Existencias </th>
                      <td mat-cell *matCellDef="let product">
                        {{product.existencias_totales}}
                        {{product.existencias_totales | mxPlurals:product.unidad_medida:'Unidades' }}
                      </td>
                    </ng-container> -->

                    <!-- BRAND COL -->
                    <ng-container matColumnDef="brand">
                      <th mat-header-cell *matHeaderCellDef> Marca </th>
                      <td mat-cell *matCellDef="let product"> {{product.brand}} </td>
                    </ng-container>

                    <!-- PROVIDER COL -->
                    <ng-container matColumnDef="provider">
                      <th mat-header-cell *matHeaderCellDef> Proveedor </th>
                      <td mat-cell *matCellDef="let product"> {{product.provider?.name || ''}} </td>
                    </ng-container>
                    
                    <!-- LAST UPDATE COL -->
                    <ng-container matColumnDef="last_update">
                      <th mat-header-cell *matHeaderCellDef> Actualizado </th>
                      <td mat-cell *matCellDef="let product"> {{product.last_update.date}} </td>
                    </ng-container>

                    <!-- CATEGORIES COL (BETA) -->
                    <ng-container matColumnDef="categories">
                      <th mat-header-cell *matHeaderCellDef> Categorias </th>
                      <td mat-cell *matCellDef="let product">
                        <span *ngFor="let catego of product.categories; index as i">
                          {{ catego }}<span *ngIf="i != product.categorias.length -1">,</span>
                        </span>
                      </td>
                    </ng-container>

                    <!-- OPTIONS COL -->
                    <ng-container matColumnDef="options">
                      <th mat-header-cell *matHeaderCellDef></th>
                      <td mat-cell *matCellDef="let product"></td>
                    </ng-container>

                    <!-- ROW MANAGE -->
                    <tr mat-header-row *matHeaderRowDef="prodCols"></tr>
                    
                    <tr mat-row 
                    class="table-row" 
                    *matRowDef="let product; columns: prodCols;" 
                    (click)="current.product$.next(product)"
                    ></tr>

                  </table>
                </ng-container>

                <!-- EMPTY TEMPLATE -->
                <ng-template #emptyProducts >
                  <div class="row">
                    <div class="col s12 center">
                      <p class="center">No se encontraron productos</p>
                    </div>
                  </div>
                </ng-template>
              </div>
            </div>
          </div>

          <!-- INDEX DE LA TABLA -->
          <div class="row">
            <div class="col s12">
              <mx-index-caller></mx-index-caller>
            </div>
          </div>
        </div>

      </mat-tab>
      <!-- <mat-tab label="Categorías">

      </mat-tab> -->
    </mat-tab-group>

  </mat-drawer-content>
</mat-drawer-container>
