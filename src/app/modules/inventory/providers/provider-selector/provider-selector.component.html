<div class="provider-selector-container">
  
  <!-- Proveedor -->
  <div class="row">
    <div class="col s12">
      <mat-form-field appearance="legacy">
        <mat-label>CRF Proveedor</mat-label>
        <input
          matInput
          type="text"
          name="crf"
          #crfInput
          [formControl]="crfCtrl"
          placeholder="Escribe un CRF para buscar"
          >
          <mat-hint *ngIf="crfCtrl.hasError('unknown')">
            No se pudo encontrar el proveedor con este CRF. Si deseas agregarlo, da click 
            <button mat-icon-button 
            (click)="openNewProvider()">
              aquí
            </button>
          </mat-hint>
      </mat-form-field>
      <p-confirmPopup></p-confirmPopup>
      
    </div>
  </div>

  <!-- Proveedor data -->
  <div class="row" *ngIf="provider">
    <div class="col s12">
      <b>DATOS DEL PROVEEDOR</b><br>
      {{ provider.name }} <br>
    </div>
  </div>
</div>
